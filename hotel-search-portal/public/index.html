<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hotel Search Portal</title>
<link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
<div id="login-view" class="view"><div class="card"><h1>Staff Login</h1><form id="login-form"><input type="text" id="username" placeholder="Username" required /><input type="password" id="password" placeholder="Password" required /><button type="submit">Log in</button></form><p id="login-error" class="error"></p></div></div>
<div id="twofa-view" class="view hidden"><div class="card"><h1>Enter Authenticator Code</h1><form id="twofa-form"><input type="text" id="twofa-code" placeholder="6-digit code" maxlength="6" required /><button type="submit">Verify</button></form><p id="twofa-error" class="error"></p></div></div>
<div id="app-view" class="view hidden"><header><h1>Hotel Search Portal</h1><div><span id="who"></span><button id="logout-btn">Log out</button></div></header>
<section class="card"><h2>New Search</h2><form id="search-form" class="search-form"><input type="text" id="s-destination" placeholder="Destination / hotel city" required /><label>Check-in<input type="date" id="s-checkin" required /></label><label>Check-out<input type="date" id="s-checkout" required /></label><label>Guests<input type="number" id="s-guests" min="1" max="30" value="2" required /></label><label>Rooms<input type="number" id="s-rooms" min="1" max="20" value="1" required /></label><label>Board<select id="s-board" required><option value="ROOM_ONLY">Room Only</option><option value="BED_AND_BREAKFAST">Bed & Breakfast</option><option value="HALF_BOARD">Half Board</option><option value="FULL_BOARD">Full Board</option><option value="ALL_INCLUSIVE">All Inclusive</option></select></label><button type="submit">Search</button></form></section>
<section class="card hidden" id="results-section"><h2>Search Results</h2><div id="search-summary" class="hint"></div><div id="live-results"></div><div id="links-list" class="links-list"></div></section>
<section class="card admin-only"><h2>Manage Sources</h2><details open><summary>Manage hotel sources (credentials are protected server-side)</summary><form id="source-form" class="source-form"><input type="text" id="src-name" placeholder="Source name" required /><input type="url" id="src-url" placeholder="Login URL" required /><input type="text" id="src-template" placeholder="Deep link template (optional)" /><input type="text" id="src-username" placeholder="Site username" /><input type="password" id="src-password" placeholder="Site password" /><button type="submit">Save Source</button></form><p id="source-error" class="error"></p><table id="sources-table"><thead><tr><th>Name</th><th>Login URL</th><th>Username</th><th>Credentials</th><th></th></tr></thead><tbody></tbody></table></details></section>
</div><script src="app.js?v=6"></script>
</body></html>
